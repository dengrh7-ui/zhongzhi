<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0e14" />
<title>瞄准训练 · Aim Lab Mobile</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#121821; --panel-2:#1a2230; --line:#283246;
    --txt:#e6edf6; --txt-2:#9aa7bd; --accent:#ff7a1a; --accent-2:#ffb84a;
    --good:#3ddc97; --bad:#ff4d6d; --aim:#ff7a1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden;overscroll-behavior:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  /* 横屏锁定提示 */
  #rotate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;
    flex-direction:column;z-index:999;text-align:center;padding:24px;}
  #rotate .ico{font-size:48px;animation:spin 2s ease-in-out infinite;}
  #rotate h2{margin:14px 0 6px;font-size:20px;}
  #rotate p{color:var(--txt-2);font-size:14px;margin:0;}
  @keyframes spin{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(70deg)}}
  @media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}

  /* 顶部 HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));z-index:5;pointer-events:none;}
  .hud-pill{background:rgba(18,24,33,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:14px;font-size:13px;}
  .hud-pill b{color:var(--accent-2);font-variant-numeric:tabular-nums;}
  .hud-pill .lbl{color:var(--txt-2);margin-right:4px;}
  #btnPause{pointer-events:auto;background:rgba(18,24,33,.7);border:1px solid var(--line);
    color:var(--txt);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;}
  #btnPause:active{transform:scale(.92);}

  /* 游戏画布 */
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;
    background:
      radial-gradient(1200px 600px at 50% 40%, #18222f 0%, #0a0e14 70%),
      linear-gradient(180deg,#0d131c 0%,#080b11 100%);
    cursor:crosshair;}

  /* 准星 */
  #crosshair{position:absolute;width:28px;height:28px;pointer-events:none;
    transform:translate(-50%,-50%);left:50%;top:50%;z-index:3;}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:var(--aim);
    box-shadow:0 0 6px rgba(255,122,26,.6);}
  #crosshair::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);}
  #crosshair::after{top:50%;left:0;right:0;height:2px;transform:translateY(-50%);}
  #crosshair .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;background:var(--aim);
    border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px var(--aim);}

  /* 开始/结算覆盖层 */
  #overlay{position:absolute;inset:0;background:rgba(8,11,17,.86);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:10;
    padding:16px;}
  #overlay.hide{display:none;}
  .card{width:min(560px,96%);background:linear-gradient(160deg,#141b27 0%,#0e131c 100%);
    border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .card h1{margin:0 0 4px;font-size:20px;letter-spacing:.5px;}
  .card h1 span{color:var(--accent);}
  .card .sub{color:var(--txt-2);font-size:12px;margin-bottom:14px;}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .mode{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;
    cursor:pointer;transition:all .15s;}
  .mode:active{transform:scale(.97);}
  .mode.active{border-color:var(--accent);background:linear-gradient(160deg,#2a1d10 0%,#1a1208 100%);
    box-shadow:0 0 0 1px var(--accent) inset;}
  .mode .name{font-size:14px;font-weight:600;}
  .mode .desc{font-size:11px;color:var(--txt-2);margin-top:2px;line-height:1.35;}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .row .field{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
  .row .field .l{font-size:11px;color:var(--txt-2);margin-bottom:4px;}
  .row .field select,.row .field input{width:100%;background:transparent;border:none;color:var(--txt);
    font-size:14px;outline:none;-webkit-appearance:none;appearance:none;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
  .stat .l{font-size:11px;color:var(--txt-2);}
  .stat .v{font-size:18px;font-weight:700;color:var(--accent-2);font-variant-numeric:tabular-nums;}
  .actions{display:flex;gap:10px;}
  .btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;
    transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(180deg,var(--accent) 0%,#e8650a 100%);color:#fff;
    box-shadow:0 6px 20px rgba(255,122,26,.35);}
  .btn-ghost{background:var(--panel-2);color:var(--txt);border:1px solid var(--line);}
  .best{font-size:11px;color:var(--txt-2);text-align:center;margin-top:8px;}
  .best b{color:var(--good);}

  /* 反馈数字 */
  .hit-text{position:absolute;font-weight:700;font-size:18px;pointer-events:none;z-index:4;
    text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp .7s ease-out forwards;}
  @keyframes floatUp{
    0%{opacity:1;transform:translate(-50%,-50%);}
    100%{opacity:0;transform:translate(-50%,-120%);}
  }
  .ripple{position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none;
    transform:translate(-50%,-50%);z-index:3;animation:ripple .4s ease-out forwards;}
  @keyframes ripple{0%{width:10px;height:10px;opacity:1;}100%{width:80px;height:80px;opacity:0;}}

  /* 反应模式信号灯 */
  #signal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(40vmin,260px);height:min(40vmin,260px);border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#5a1218,#2b0608);
    border:6px solid #3a0a0e;display:none;z-index:2;
    box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.5);}
  #signal.go{background:radial-gradient(circle at 30% 30%,#5fffa3,#0b8a44);
    border-color:#0d7038;box-shadow:0 10px 60px rgba(61,220,151,.5),inset 0 0 40px rgba(0,0,0,.3);}
  #signal.show{display:block;}

  /* 触摸提示 */
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    color:var(--txt-2);font-size:12px;background:rgba(18,24,33,.6);padding:6px 12px;
    border-radius:20px;border:1px solid var(--line);z-index:4;}
</style>
</head>
<body>
<div id="rotate">
  <div class="ico">📱↻</div>
  <h2>请横屏使用</h2>
  <p>把手机横过来获得最佳瞄准训练体验</p>
</div>

<div id="app">
  <canvas id="stage"></canvas>
  <div id="signal"></div>
  <div id="crosshair"><div class="dot"></div></div>

  <div id="hud">
    <div class="hud-pill">
      <div><span class="lbl">分数</span><b id="hScore">0</b></div>
      <div><span class="lbl">命中</span><b id="hHit">0</b>/<b id="hShot">0</b></div>
      <div><span class="lbl">连击</span><b id="hCombo">0</b></div>
      <div><span class="lbl">用时</span><b id="hTime">60</b>s</div>
    </div>
    <button id="btnPause" title="暂停">⏸</button>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>瞄准训练 <span>· Aim Trainer</span></h1>
      <div class="sub">为三角洲 / 和平精英 / 移动端 FPS 玩家设计 · 横屏触控</div>

      <div class="modes" id="modes">
        <div class="mode active" data-mode="flick">
          <div class="name">🎯 闪击 Flick</div>
          <div class="desc">大小随机的静态目标，练习快速点射</div>
        </div>
        <div class="mode" data-mode="track">
          <div class="name">🌀 跟踪 Track</div>
          <div class="desc">按住滑动跟随移动目标，练习压枪/扫射</div>
        </div>
        <div class="mode" data-mode="react">
          <div class="name">⚡ 反应 React</div>
          <div class="desc">红灯转绿立即点击，测量反应时间</div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <div class="l">难度</div>
          <select id="selDiff">
            <option value="easy">新手 (大目标 / 慢)</option>
            <option value="normal" selected>普通</option>
            <option value="hard">高手 (小目标 / 快)</option>
            <option value="pro">职业 (微目标 / 极快)</option>
          </select>
        </div>
        <div class="field">
          <div class="l">时长</div>
          <select id="selDur">
            <option value="30">30 秒</option>
            <option value="60" selected>60 秒</option>
            <option value="90">90 秒</option>
            <option value="120">120 秒</option>
          </select>
        </div>
        <div class="field">
          <div class="l">准星</div>
          <select id="selCH">
            <option value="cross" selected>十字</option>
            <option value="dot">圆点</option>
            <option value="off">隐藏</option>
          </select>
        </div>
      </div>

      <div class="stats" id="lastStats" style="display:none;">
        <div class="stat"><div class="l">最终得分</div><div class="v" id="sScore">0</div></div>
        <div class="stat"><div class="l">命中率</div><div class="v" id="sAcc">0%</div></div>
        <div class="stat"><div class="l">最高连击</div><div class="v" id="sCombo">0</div></div>
        <div class="stat"><div class="l">平均反应</div><div class="v" id="sRT">— ms</div></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="btnHow">玩法</button>
        <button class="btn btn-primary" id="btnStart">开始训练</button>
      </div>
      <div class="best">最佳 · <span id="bestLabel">闪击 普通</span> · <b id="bestVal">—</b></div>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const overlay = document.getElementById('overlay');
  const signal = document.getElementById('signal');
  const crosshair = document.getElementById('crosshair');
  const hScore = document.getElementById('hScore');
  const hHit = document.getElementById('hHit');
  const hShot = document.getElementById('hShot');
  const hCombo = document.getElementById('hCombo');
  const hTime = document.getElementById('hTime');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnHow = document.getElementById('btnHow');
  const selDiff = document.getElementById('selDiff');
  const selDur = document.getElementById('selDur');
  const selCH = document.getElementById('selCH');
  const lastStats = document.getElementById('lastStats');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = stage.clientWidth = window.innerWidth;
    H = stage.clientHeight = window.innerHeight;
    stage.width = W*DPR; stage.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // 难度配置
  const DIFF = {
    easy:   {minR:34,maxR:54,spawn:900,trackR:46,trackSpd:90,reactMin:1200,reactMax:2800},
    normal: {minR:24,maxR:42,spawn:700,trackR:34,trackSpd:140,reactMin:900,reactMax:2400},
    hard:   {minR:16,maxR:30,spawn:520,trackR:24,trackSpd:200,reactMin:700,reactMax:2000},
    pro:    {minR:10,maxR:20,spawn:380,trackR:18,trackSpd:280,reactMin:500,reactMax:1700},
  };

  const state = {
    mode:'flick', diff:'normal', dur:60,
    running:false, paused:false,
    score:0, hit:0, shot:0, combo:0, maxCombo:0,
    timeLeft:60, lastFrame:0, lastSpawn:0,
    targets:[], track:null, trackHoldStart:0, trackHoldMs:0,
    reactState:'idle', reactT0:0, reactTimes:[], reactTimer:0,
    pointerDown:false, pointerX:0, pointerY:0,
  };

  // 设置准星
  function applyCrosshair(){
    const v = selCH.value;
    crosshair.style.display = v==='off' ? 'none' : 'block';
    crosshair.querySelector('.dot').style.display = v==='cross' ? 'block' : (v==='dot'?'block':'none');
    crosshair.style.setProperty('--show-cross', v==='cross' ? '1':'0');
    // 用 className 控制简单：dot 模式隐藏十字线
    if(v==='dot'){
      crosshair.style.setProperty('opacity','1');
      crosshair.classList.add('dot-only');
    } else {
      crosshair.classList.remove('dot-only');
    }
  }
  const styleExtra = document.createElement('style');
  styleExtra.textContent = `.dot-only::before,.dot-only::after{display:none!important;}.dot-only .dot{width:6px;height:6px;}`;
  document.head.appendChild(styleExtra);
  selCH.addEventListener('change', applyCrosshair);
  applyCrosshair();

  // 模式选择
  document.querySelectorAll('.mode').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      state.mode = el.dataset.mode;
      updateBestLabel();
    });
  });

  function modeLabel(m){return {flick:'闪击',track:'跟踪',react:'反应'}[m]||m;}
  function diffLabel(d){return {easy:'新手',normal:'普通',hard:'高手',pro:'职业'}[d]||d;}
  function bestKey(){return `aim_best_${state.mode}_${state.diff}_${state.dur}`;}
  function updateBestLabel(){
    document.getElementById('bestLabel').textContent = `${modeLabel(state.mode)} ${diffLabel(state.diff)} ${state.dur}s`;
    const v = localStorage.getItem(bestKey());
    document.getElementById('bestVal').textContent = v ? (state.mode==='react' ? v+' ms' : v) : '—';
  }
  selDiff.addEventListener('change',()=>{state.diff=selDiff.value;updateBestLabel();});
  selDur.addEventListener('change',()=>{state.dur=parseInt(selDur.value,10);updateBestLabel();});
  updateBestLabel();

  // 触摸/点击事件
  function evtPos(e){
    const t = e.touches ? e.touches[0] : (e.changedTouches?e.changedTouches[0]:e);
    return {x:t.clientX, y:t.clientY};
  }
  stage.addEventListener('pointerdown', onDown, {passive:false});
  stage.addEventListener('pointermove', onMove, {passive:false});
  stage.addEventListener('pointerup', onUp, {passive:false});
  stage.addEventListener('pointercancel', onUp, {passive:false});
  function onDown(e){
    e.preventDefault();
    if(!state.running || state.paused) return;
    const {x,y} = evtPos(e);
    state.pointerDown = true; state.pointerX=x; state.pointerY=y;
    if(state.mode==='flick') handleFlick(x,y);
    else if(state.mode==='track') startTrackHold(x,y);
    else if(state.mode==='react') handleReactClick();
  }
  function onMove(e){
    e.preventDefault();
    if(!state.running||state.paused) return;
    if(!state.pointerDown) return;
    const {x,y}=evtPos(e);
    state.pointerX=x; state.pointerY=y;
  }
  function onUp(e){
    e.preventDefault();
    state.pointerDown=false;
  }

  // ===== 通用反馈 =====
  function spawnHitText(x,y,txt,color){
    const el=document.createElement('div');
    el.className='hit-text';
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.color=color||'var(--good)';
    el.textContent=txt;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),700);
  }
  function ripple(x,y){
    const el=document.createElement('div');
    el.className='ripple';
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),400);
  }
  function haptic(ms){ if(navigator.vibrate) navigator.vibrate(ms||10); }

  // ===== 闪击模式 =====
  function spawnTarget(){
    const d = DIFF[state.diff];
    const r = d.minR + Math.random()*(d.maxR-d.minR);
    const pad = r+20;
    const x = pad + Math.random()*(W-pad*2);
    const y = pad+60 + Math.random()*(H-pad*2-80);
    const life = 1600 + Math.random()*800;
    state.targets.push({x,y,r,born:performance.now(),life,hit:false});
  }
  function handleFlick(x,y){
    state.shot++;
    // 命中最上层（后插入优先）
    for(let i=state.targets.length-1;i>=0;i--){
      const t = state.targets[i];
      const dx=x-t.x, dy=y-t.y;
      if(dx*dx+dy*dy <= t.r*t.r){
        const accBonus = Math.max(0, 1 - Math.hypot(dx,dy)/t.r);
        const size = (1 - (t.r-DIFF[state.diff].minR)/(DIFF[state.diff].maxR-DIFF[state.diff].minR));
        const pts = Math.round(40 + accBonus*30 + size*40);
        state.score += pts;
        state.hit++; state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
        if(state.combo>=3) state.score += state.combo;
        spawnHitText(x,y,'+'+pts,'var(--good)');
        ripple(x,y);
        haptic(12);
        state.targets.splice(i,1);
        updateHUD();
        return;
      }
    }
    // 未命中
    state.combo=0;
    state.score = Math.max(0, state.score-5);
    spawnHitText(x,y,'MISS','var(--bad)');
    haptic(4);
    updateHUD();
  }

  // ===== 跟踪模式 =====
  function spawnTrack(){
    const d = DIFF[state.diff];
    const r = d.trackR;
    state.track = {
      x: W*0.3 + Math.random()*W*0.4,
      y: H*0.3 + Math.random()*H*0.4,
      r,
      vx: (Math.random()<0.5?-1:1)*d.trackSpd*(0.6+Math.random()*0.6),
      vy: (Math.random()<0.5?-1:1)*d.trackSpd*(0.6+Math.random()*0.6),
      changeAt: performance.now()+800+Math.random()*1200,
    };
  }
  function updateTrack(dt){
    const t = state.track; if(!t) return;
    t.x += t.vx*dt; t.y += t.vy*dt;
    const pad = t.r+8;
    if(t.x<pad){t.x=pad;t.vx*=-1;} if(t.x>W-pad){t.x=W-pad;t.vx*=-1;}
    if(t.y<pad+50){t.y=pad+50;t.vy*=-1;} if(t.y>H-pad){t.y=H-pad;t.vy*=-1;}
    if(performance.now()>t.changeAt){
      const d=DIFF[state.diff];
      const ang = Math.random()*Math.PI*2;
      t.vx = Math.cos(ang)*d.trackSpd*(0.6+Math.random()*0.7);
      t.vy = Math.sin(ang)*d.trackSpd*(0.6+Math.random()*0.7);
      t.changeAt = performance.now()+700+Math.random()*1200;
    }
    // 跟踪计分
    if(state.pointerDown){
      const dx = state.pointerX-t.x, dy=state.pointerY-t.y;
      if(dx*dx+dy*dy <= t.r*t.r){
        state.trackHoldMs += dt*1000;
        const pts = Math.round(dt*60); // 约每秒60分
        state.score += pts;
        state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
        if(Math.floor(state.trackHoldMs)%200<16){ updateHUD(); }
      } else {
        state.combo=0;
      }
    } else {
      state.combo=0;
    }
  }
  function startTrackHold(x,y){ /* hold 由 update 判定 */ }

  // ===== 反应模式 =====
  function startReact(){
    state.reactState='wait';
    signal.classList.remove('go'); signal.classList.add('show');
    const d=DIFF[state.diff];
    const wait = d.reactMin + Math.random()*(d.reactMax-d.reactMin);
    clearTimeout(state.reactTimer);
    state.reactTimer = setTimeout(()=>{
      if(!state.running) return;
      state.reactState='go';
      signal.classList.add('go');
      state.reactT0 = performance.now();
    }, wait);
  }
  function handleReactClick(){
    if(state.reactState==='wait'){
      // 抢跑
      state.combo=0;
      state.score = Math.max(0, state.score-20);
      spawnHitText(W/2, H/2-150, '抢跑 -20', 'var(--bad)');
      haptic(40);
      clearTimeout(state.reactTimer);
      signal.classList.remove('go');
      setTimeout(()=>{ if(state.running && state.mode==='react') startReact(); }, 500);
      updateHUD();
    } else if(state.reactState==='go'){
      const rt = performance.now()-state.reactT0;
      state.reactTimes.push(rt);
      state.hit++; state.shot++;
      const pts = Math.max(20, Math.round(800 - rt));
      state.score += pts;
      state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
      spawnHitText(W/2, H/2-150, Math.round(rt)+' ms · +'+pts, 'var(--good)');
      haptic(20);
      signal.classList.remove('go','show');
      state.reactState='idle';
      setTimeout(()=>{ if(state.running && state.mode==='react') startReact(); }, 600);
      updateHUD();
    }
  }

  // ===== 渲染 =====
  function drawTarget(x,y,r,age,life){
    // 随生命周期颜色：橙→红
    const k = Math.min(1, age/life);
    const outer = `rgba(255,${122-k*60},${26-k*26},1)`;
    const grad = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    grad.addColorStop(0,'#fff7e8');
    grad.addColorStop(0.4,outer);
    grad.addColorStop(1,'#5a1a02');
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();
    // 同心圈
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,r*0.55,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,r*0.22,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    // 倒计时环
    if(life){
      const rem = 1 - k;
      ctx.strokeStyle = rem<0.3 ? 'rgba(255,77,109,.9)' : 'rgba(255,255,255,.35)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(x,y,r+6,-Math.PI/2,-Math.PI/2 + Math.PI*2*rem);
      ctx.stroke();
    }
  }
  function drawTrackTarget(t){
    drawTarget(t.x,t.y,t.r,0,0);
    if(state.pointerDown){
      const dx=state.pointerX-t.x, dy=state.pointerY-t.y;
      if(dx*dx+dy*dy <= t.r*t.r){
        ctx.strokeStyle='rgba(61,220,151,.9)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(t.x,t.y,t.r+8,0,Math.PI*2); ctx.stroke();
      }
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // 网格
    ctx.strokeStyle='rgba(40,50,70,.5)'; ctx.lineWidth=1;
    const gs=60;
    for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    if(state.mode==='flick'){
      const now=performance.now();
      for(const t of state.targets) drawTarget(t.x,t.y,t.r, now-t.born, t.life);
    } else if(state.mode==='track' && state.track){
      drawTrackTarget(state.track);
    }
  }

  // ===== 主循环 =====
  function loop(ts){
    if(!state.running){ return; }
    if(!state.lastFrame) state.lastFrame=ts;
    const dt = Math.min(0.05,(ts-state.lastFrame)/1000);
    state.lastFrame=ts;
    if(!state.paused){
      state.timeLeft -= dt;
      if(state.timeLeft<=0){ end(); return; }
      hTime.textContent = Math.ceil(state.timeLeft);

      if(state.mode==='flick'){
        // 过期目标
        const now=performance.now();
        for(let i=state.targets.length-1;i>=0;i--){
          if(now-state.targets[i].born > state.targets[i].life){
            state.targets.splice(i,1);
            state.combo=0;
          }
        }
        // 生成
        if(now-state.lastSpawn > DIFF[state.diff].spawn && state.targets.length<5){
          spawnTarget(); state.lastSpawn=now;
        }
      } else if(state.mode==='track'){
        if(!state.track) spawnTrack();
        updateTrack(dt);
      }
      render();
    }
    requestAnimationFrame(loop);
  }

  function updateHUD(){
    hScore.textContent = state.score;
    hHit.textContent = state.hit;
    hShot.textContent = state.shot;
    hCombo.textContent = state.combo;
  }

  function start(){
    state.diff = selDiff.value;
    state.dur = parseInt(selDur.value,10);
    state.running=true; state.paused=false;
    state.score=0; state.hit=0; state.shot=0; state.combo=0; state.maxCombo=0;
    state.timeLeft = state.dur; state.lastFrame=0; state.lastSpawn=0;
    state.targets=[]; state.track=null; state.trackHoldMs=0;
    state.reactTimes=[]; state.reactState='idle';
    lastStats.style.display='none';
    overlay.classList.add('hide');
    signal.classList.remove('show','go');
    updateHUD();
    resize();
    if(state.mode==='react') startReact();
    requestAnimationFrame(loop);
  }
  function end(){
    state.running=false;
    clearTimeout(state.reactTimer);
    signal.classList.remove('show','go');
    const acc = state.shot ? Math.round(state.hit*100/state.shot) : 0;
    const avgRT = state.reactTimes.length ?
      Math.round(state.reactTimes.reduce((a,b)=>a+b,0)/state.reactTimes.length) : null;

    // 存最佳
    const k = bestKey();
    if(state.mode==='react'){
      if(avgRT!=null){
        const prev = parseInt(localStorage.getItem(k)||'0',10);
        if(!prev || avgRT<prev) localStorage.setItem(k, avgRT);
      }
    } else {
      const prev = parseInt(localStorage.getItem(k)||'0',10);
      if(state.score>prev) localStorage.setItem(k, state.score);
    }
    updateBestLabel();

    document.getElementById('sScore').textContent = state.score;
    document.getElementById('sAcc').textContent = acc+'%';
    document.getElementById('sCombo').textContent = state.maxCombo;
    document.getElementById('sRT').textContent = avgRT!=null ? avgRT+' ms' : '—';
    lastStats.style.display='grid';
    overlay.classList.remove('hide');
  }

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', ()=>{
    if(!state.running) return;
    state.paused = !state.paused;
    btnPause.textContent = state.paused ? '▶' : '⏸';
  });
  btnHow.addEventListener('click', ()=>{
    alert('玩法说明\n\n🎯 闪击：橙色目标会限时存在，点中得分，越快越准越高分；脱靶扣分并断连击。\n🌀 跟踪：持续按住跟随移动目标，停留在圈内会持续加分，离开立即断连击。\n⚡ 反应：等红色信号变绿后立刻点击屏幕，越快得分越高；抢跑扣 20 分。\n\n建议横屏 + 静音模式专注训练。');
  });

  // 初次自适应
  resize();
  // 防止双击缩放
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('dblclick', e=>e.preventDefault());
})();
</script>
</body>
</html>
