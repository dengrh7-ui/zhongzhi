<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#eaf2ff" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>种植日记</title>
<style>
  :root {
    --bg: #eaf2ff;
    --bg-elev: rgba(255, 255, 255, 0.78);
    --card: #ffffff;
    --text: #0a2540;
    --text-2: #14365e;
    --text-3: rgba(20, 54, 94, 0.55);
    --separator: rgba(0, 122, 255, 0.12);
    --blue: #007aff;
    --blue-soft: #e4f0ff;
    --red: #ff3b30;
    --fill: rgba(0, 122, 255, 0.10);
    --fill-2: rgba(0, 122, 255, 0.06);
    --border: rgba(0, 122, 255, 0.06);
    --shadow: 0 2px 12px rgba(0, 60, 140, 0.06);
    --c-first: #5ac8fa;
    --c-stage1: #007aff;
    --c-stage2: #af52de;
    --c-restore: #34c759;
    --radius-xl: 22px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, #d6e7ff 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #e7f1ff 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text",
      "SF Pro Display", "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }

  .nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg-elev);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 0.5px solid var(--separator);
    padding: 12px 20px 12px;
    padding-top: calc(env(safe-area-inset-top) + 12px);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    color: var(--blue);
    display: flex; align-items: center; gap: 10px;
  }
  .nav h1 .logo {
    width: 30px; height: 30px; border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0, 122, 255, 0.28);
  }
  .nav .btn-add {
    background: var(--blue); color: #fff; border: none;
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 22px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s ease, opacity .15s ease;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.28);
  }
  .nav .btn-add:active { transform: scale(0.92); opacity: .9; }

  .segmented {
    display: flex; background: var(--fill);
    border-radius: 14px; padding: 3px; margin-top: 12px;
    position: relative;
  }
  .segmented button {
    flex: 1; border: none; background: transparent;
    padding: 7px 10px; font-size: 13px; font-weight: 500;
    color: var(--text-2); cursor: pointer;
    border-radius: 11px;
    font-family: inherit;
    transition: color .2s ease;
  }
  .segmented button.active {
    background: var(--card);
    box-shadow: 0 3px 10px rgba(0, 60, 140, 0.10), 0 1px 1px rgba(0,0,0,.04);
    font-weight: 600;
    color: var(--blue);
  }

  .container { max-width: 720px; margin: 0 auto; padding: 16px; }

  .search {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .search svg { flex: 0 0 16px; color: var(--blue); opacity: .65; }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 17px; color: var(--text);
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-3); }

  .empty {
    text-align: center; padding: 80px 24px; color: var(--text-3);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty h2 { font-size: 20px; color: var(--text-2); margin: 0 0 6px; font-weight: 600; }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease;
    border: 1px solid var(--border);
  }
  .card:active { transform: scale(0.985); }
  .card, .event { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .card .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card .name { font-size: 17px; font-weight: 600; }
  .card .date { font-size: 13px; color: var(--blue); font-weight: 500; }
  .card .meta { font-size: 14px; color: var(--text-3); margin-top: 6px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 10px;
    background: var(--blue-soft); font-size: 12px; color: var(--blue);
    margin-right: 6px; font-weight: 500;
  }

  /* Calendar */
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-head .month { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .cal-head .nav-btns { display: flex; gap: 8px; }
  .cal-head .nav-btns button {
    border: none; background: var(--card); color: var(--blue);
    width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; font-size: 18px; line-height: 1;
    font-family: inherit;
    box-shadow: var(--shadow);
  }
  .cal-head .nav-btns button.today {
    width: auto; padding: 0 14px; font-size: 14px;
    background: var(--blue); color: #fff; font-weight: 600;
    border-radius: 17px;
    box-shadow: 0 4px 10px rgba(0, 122, 255, 0.22);
  }
  .week-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--card); border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .day-head {
    text-align: center; padding: 10px 2px 8px;
    font-size: 11px; color: var(--text-3); font-weight: 500;
    border-bottom: 0.5px solid var(--separator);
    background: var(--blue-soft);
  }
  .day-head .dow { text-transform: uppercase; letter-spacing: .5px; }
  .day-head .dnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; margin-top: 2px;
    font-size: 15px; color: var(--text); font-weight: 600;
  }
  .day-head.today .dnum { background: var(--blue); color: #fff; }
  .day-col {
    min-height: 320px;
    border-right: 0.5px solid var(--separator);
    display: flex; flex-direction: column;
  }
  .day-col:last-child { border-right: none; }
  .period {
    flex: 1; padding: 14px 4px 4px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
    min-height: 140px;
  }
  .period.am { border-bottom: 1px dashed var(--separator); }
  .period::before {
    content: attr(data-label);
    position: absolute; top: 3px; left: 4px;
    font-size: 9px; color: var(--text-3);
    font-weight: 700; letter-spacing: .4px;
    pointer-events: none;
  }
  .event {
    border-radius: 10px; padding: 6px 8px;
    font-size: 11px; line-height: 1.25;
    cursor: pointer; color: #fff;
    overflow: hidden; word-break: break-all;
    box-shadow: 0 2px 6px rgba(0, 60, 140, 0.10);
  }
  .event .ev-name { font-weight: 600; }
  .event .ev-type { opacity: 0.9; font-size: 10px; }
  .event.t-first { background: var(--c-first); }
  .event.t-stage1 { background: var(--c-stage1); }
  .event.t-stage2 { background: var(--c-stage2); }
  .event.t-restore { background: var(--c-restore); }

  /* Modal sheet */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    z-index: 50;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.32,.72,0,1);
    z-index: 60;
    padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
    box-shadow: 0 -8px 30px rgba(0, 60, 140, 0.12);
  }
  .sheet.show { transform: translateY(0); }
  .sheet .handle {
    width: 36px; height: 5px; border-radius: 3px;
    background: var(--fill); margin: 8px auto 4px;
  }
  .sheet-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px 12px;
  }
  .sheet-head .title { font-size: 17px; font-weight: 600; }
  .sheet-head button {
    background: none; border: none; color: var(--blue);
    font-size: 17px; cursor: pointer; padding: 6px 4px;
    font-family: inherit;
  }
  .sheet-head button.primary { font-weight: 600; }
  .sheet-head button:disabled { color: var(--text-3); }

  .group {
    background: var(--card); border-radius: var(--radius-lg);
    margin: 10px 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .field {
    display: flex; align-items: center;
    padding: 11px 16px;
    border-bottom: 0.5px solid var(--separator);
    gap: 12px;
    min-height: 44px;
  }
  .field:last-child { border-bottom: none; }
  .field label { color: var(--text); font-size: 15px; min-width: 76px; flex-shrink: 0; }
  .field input, .field select, .field textarea {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 17px; color: var(--text); text-align: right;
    font-family: inherit;
  }
  .field textarea { text-align: left; resize: none; min-height: 22px; padding: 0; }
  .field.stacked { flex-direction: column; align-items: stretch; gap: 6px; }
  .field.stacked label { font-size: 13px; color: var(--text-3); }
  .field.stacked textarea { text-align: left; min-height: 60px; }
  .field.picker { cursor: pointer; }
  .field.picker .value {
    flex: 1; text-align: right; color: var(--text);
    font-size: 17px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .field.picker .value.empty { color: var(--text-3); }
  .field.picker .chev { color: var(--text-3); font-size: 14px; }

  .group-title {
    font-size: 13px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.4px;
    margin: 18px 24px 6px;
  }

  .btn-delete {
    display: block; width: calc(100% - 32px);
    margin: 16px; padding: 14px;
    background: var(--card); color: var(--red);
    border: none; border-radius: var(--radius-md);
    font-size: 17px; font-weight: 500; cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow);
  }
  .btn-delete:active { background: var(--blue-soft); }

  .detail-row {
    display: flex; justify-content: space-between;
    padding: 11px 16px; border-bottom: 0.5px solid var(--separator);
    gap: 12px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-3); font-size: 15px; flex-shrink: 0; }
  .detail-row .v { color: var(--text); font-size: 17px; text-align: right; word-break: break-all; }
  .detail-row.stacked { flex-direction: column; gap: 4px; }
  .detail-row.stacked .v { text-align: left; }

  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; }
  select { appearance: none; -webkit-appearance: none; padding-right: 4px; }
  .period-sel {
    flex: 0 0 auto !important; width: 56px; min-width: 56px;
    text-align: right; font-size: 15px !important;
    color: var(--blue) !important; padding-left: 6px;
    font-weight: 500;
  }
  .field input[type="date"] { flex: 1; }

  /* Tooth chart */
  .teeth {
    padding: 12px 8px;
  }
  .teeth-row {
    display: grid; grid-template-columns: repeat(16, 1fr);
    gap: 3px; margin-bottom: 4px;
  }
  .teeth-row.lower { margin-top: 6px; }
  .tooth {
    aspect-ratio: 1 / 1.15;
    border: 1px solid rgba(0, 122, 255, 0.18);
    background: var(--card);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    color: var(--text-2); cursor: pointer;
    user-select: none;
    transition: transform .08s ease, background .15s ease;
  }
  .tooth.gap-r { margin-right: 4px; }
  .tooth.sel {
    background: var(--blue); color: #fff; border-color: var(--blue);
    box-shadow: 0 3px 8px rgba(0, 122, 255, 0.28);
  }
  .tooth:active { transform: scale(0.9); }
  .teeth-summary {
    padding: 8px 16px 0; font-size: 13px; color: var(--text-3);
  }
  .midline {
    height: 1px; background: var(--separator);
    margin: 4px 8px;
  }

  /* Implant system picker */
  .chips { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--blue-soft); color: var(--blue);
    padding: 9px 16px; border-radius: 20px;
    font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid transparent;
    font-weight: 500;
    transition: transform .1s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip.sel {
    background: var(--blue); color: #fff;
    box-shadow: 0 4px 10px rgba(0, 122, 255, 0.28);
  }
  .chip .del {
    color: rgba(0, 122, 255, 0.5); font-size: 13px;
    margin-left: 2px;
  }
  .chip.sel .del { color: rgba(255,255,255,.85); }
  .add-row {
    display: flex; gap: 8px; padding: 12px 16px 4px;
  }
  .add-row input {
    flex: 1; padding: 11px 14px; border-radius: var(--radius-sm);
    border: none; background: var(--card);
    font-size: 15px; outline: none; color: var(--text);
    font-family: inherit;
    box-shadow: var(--shadow);
  }
  .add-row button {
    background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 0 18px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 10px rgba(0, 122, 255, 0.22);
  }
  .add-row button:disabled { opacity: .4; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-row">
    <h1><img class="logo" src="icon.svg" alt="" />种植日记</h1>
    <button class="btn-add" id="btnNew" aria-label="新建">+</button>
  </div>
  <div class="segmented" id="seg">
    <button data-view="cal" class="active">日历</button>
    <button data-view="list">列表</button>
  </div>
</div>

<div class="container">
  <div id="viewList" style="display:none;">
    <div class="search">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
        <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.85 4.36a6 6 0 1 1 .71-.7l3.49 3.49a.5.5 0 0 1-.71.71l-3.49-3.5z"/>
      </svg>
      <input id="search" placeholder="搜索患者、种植系统…" />
    </div>
    <div id="list"></div>
  </div>

  <div id="viewCal">
    <div class="cal-head">
      <div class="month" id="calMonth"></div>
      <div class="nav-btns">
        <button id="calPrev" aria-label="上一周">‹</button>
        <button class="today" id="calToday">今天</button>
        <button id="calNext" aria-label="下一周">›</button>
      </div>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div style="margin-top:14px; font-size:12px; color:var(--text-3); padding: 0 4px;">
      <span class="badge" style="background:var(--c-first);color:#fff;">初诊</span>
      <span class="badge" style="background:var(--c-stage1);color:#fff;">一期</span>
      <span class="badge" style="background:var(--c-stage2);color:#fff;">二期</span>
      <span class="badge" style="background:var(--c-restore);color:#fff;">修复</span>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- Edit sheet -->
<div class="sheet" id="editSheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <button id="editCancel">取消</button>
    <div class="title" id="editTitle">新建记录</div>
    <button class="primary" id="editSave">保存</button>
  </div>

  <div class="group-title">基本信息</div>
  <div class="group">
    <div class="field">
      <label>初诊日期</label>
      <input type="date" id="f_firstVisit" />
      <select id="f_firstVisitP" class="period-sel">
        <option value="am">上午</option>
        <option value="pm">下午</option>
      </select>
    </div>
    <div class="field">
      <label>姓名</label>
      <input type="text" id="f_name" placeholder="患者姓名" />
    </div>
    <div class="field">
      <label>性别</label>
      <select id="f_gender">
        <option value="">未填写</option>
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </div>
    <div class="field">
      <label>年龄</label>
      <input type="number" id="f_age" min="0" max="150" placeholder="—" />
    </div>
    <div class="field">
      <label>联系方式</label>
      <input type="tel" id="f_contact" placeholder="电话 / 微信" />
    </div>
  </div>

  <div class="group-title">方案</div>
  <div class="group">
    <div class="field picker" id="pickTeeth">
      <label>牙位</label>
      <div class="value empty" id="teethVal">点击选择</div>
      <span class="chev">›</span>
    </div>
    <div class="field picker" id="pickSystem">
      <label>种植系统</label>
      <div class="value empty" id="systemVal">点击选择</div>
      <span class="chev">›</span>
    </div>
    <div class="field stacked">
      <label>手术方案</label>
      <textarea id="f_plan" placeholder="术式、上颌窦提升、骨增量等"></textarea>
    </div>
    <div class="field stacked">
      <label>手术耗材</label>
      <textarea id="f_materials" placeholder="种植体规格、骨粉、膜、愈合基台等"></textarea>
    </div>
  </div>

  <div class="group-title">时间安排</div>
  <div class="group">
    <div class="field">
      <label>一期手术</label>
      <input type="date" id="f_stage1" />
      <select id="f_stage1P" class="period-sel">
        <option value="am">上午</option>
        <option value="pm">下午</option>
      </select>
    </div>
    <div class="field">
      <label>二期手术</label>
      <input type="date" id="f_stage2" />
      <select id="f_stage2P" class="period-sel">
        <option value="am">上午</option>
        <option value="pm">下午</option>
      </select>
    </div>
    <div class="field">
      <label>修复时间</label>
      <input type="date" id="f_restore" />
      <select id="f_restoreP" class="period-sel">
        <option value="am">上午</option>
        <option value="pm">下午</option>
      </select>
    </div>
  </div>

  <button class="btn-delete" id="btnDelete" style="display:none;">删除记录</button>
</div>

<!-- Detail sheet -->
<div class="sheet" id="detailSheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <button id="detailClose">完成</button>
    <div class="title" id="detailTitle">详情</div>
    <button class="primary" id="detailEdit">编辑</button>
  </div>
  <div id="detailBody"></div>
</div>

<!-- Tooth picker sheet -->
<div class="sheet" id="teethSheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <button id="teethCancel">取消</button>
    <div class="title">选择牙位</div>
    <button class="primary" id="teethDone">完成</button>
  </div>
  <div class="teeth-summary" id="teethSummary">未选择</div>
  <div class="teeth" id="teethGrid"></div>
  <div style="padding: 0 16px 8px; font-size:12px; color:var(--text-3); text-align:center;">
    FDI 标记法 · 上排 1-2 象限 · 下排 4-3 象限
  </div>
</div>

<!-- Implant system picker sheet -->
<div class="sheet" id="systemSheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <button id="systemCancel">取消</button>
    <div class="title">选择种植系统</div>
    <button class="primary" id="systemDone">完成</button>
  </div>
  <div class="chips" id="systemChips"></div>
  <div class="add-row">
    <input type="text" id="systemNew" placeholder="添加新系统，如 Bicon" maxlength="40" />
    <button id="systemAdd">添加</button>
  </div>
  <div style="padding: 6px 20px 0; font-size:12px; color:var(--text-3);">
    点击系统选择 · 点 × 删除
  </div>
</div>

<script>
const STORAGE_KEY = 'zhongzhi_records_v1';
const SYSTEMS_KEY = 'zhongzhi_systems_v1';
const DEFAULT_SYSTEMS = ['Straumann', 'Nobel Biocare', 'Astra Tech', 'Osstem', 'Dentium', 'BLT', 'BLX', 'ITI'];

const FDI_UPPER = ['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'];
const FDI_LOWER = ['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38'];

const $ = (id) => document.getElementById(id);

let records = load(STORAGE_KEY, []);
let systems = load(SYSTEMS_KEY, DEFAULT_SYSTEMS);
let editingId = null;
let viewingId = null;
let currentView = 'cal';
let weekAnchor = startOfWeek(new Date());

// Working state for pickers
let pickTeethState = [];
let pickSystemState = '';

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch { return fallback; }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(SYSTEMS_KEY, JSON.stringify(systems));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function attachLongPress(el, onLong, ms = 550) {
  let timer = null, fired = false, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('pointerdown', (e) => {
    fired = false; sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      fired = true; timer = null;
      if (navigator.vibrate) navigator.vibrate(15);
      onLong(e);
    }, ms);
  });
  el.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) cancel();
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('click', (e) => {
    if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; }
  }, true);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

function deleteRecord(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  if (confirm(`删除「${r.name || '未命名'}」这条记录？`)) {
    records = records.filter(x => x.id !== id);
    persist(); render();
  }
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtShort(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function pLabel(p) { return p === 'pm' ? '下午' : (p === 'am' ? '上午' : ''); }
function fmtDateP(s, p) {
  if (!s) return '';
  const label = pLabel(p);
  return fmtDate(s) + (label ? ' ' + label : '');
}
function fmtShortP(s, p) {
  if (!s) return '';
  const label = pLabel(p);
  return fmtShort(s) + (label ? ' ' + label : '');
}
function toISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function startOfWeek(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = x.getDay(); // 0=Sun
  const diff = (dow + 6) % 7; // Monday-based
  x.setDate(x.getDate() - diff);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }

// ---------- List view ----------
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');
  let items = records.slice().sort((a,b) => (b.firstVisit||'').localeCompare(a.firstVisit||''));
  if (q) {
    items = items.filter(r =>
      (r.name||'').toLowerCase().includes(q) ||
      (r.system||'').toLowerCase().includes(q) ||
      (r.contact||'').toLowerCase().includes(q) ||
      (r.teeth||[]).join(' ').includes(q)
    );
  }
  if (items.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="icon">🦷</div>
      <h2>${records.length === 0 ? '还没有记录' : '没有匹配的结果'}</h2>
      <div>${records.length === 0 ? '点击右上角 + 新建第一条记录' : '试试其他关键词'}</div>
    </div>`;
    return;
  }
  list.innerHTML = items.map(r => `
    <div class="card" data-id="${r.id}">
      <div class="row1">
        <div class="name">${esc(r.name) || '未命名'} <span style="color:var(--text-3);font-weight:400;font-size:14px;">${esc(r.gender||'')}${r.age?` · ${r.age}岁`:''}</span></div>
        <div class="date">${fmtShort(r.firstVisit)}</div>
      </div>
      <div class="meta">
        ${(r.teeth&&r.teeth.length) ? `<span class="badge">${r.teeth.join(', ')}</span>` : ''}
        ${r.system ? `<span class="badge">${esc(r.system)}</span>` : ''}
        ${r.stage1 ? `一期 ${fmtShortP(r.stage1, r.stage1P)} · ` : ''}
        ${r.stage2 ? `二期 ${fmtShortP(r.stage2, r.stage2P)} · ` : ''}
        ${r.restore ? `修复 ${fmtShortP(r.restore, r.restoreP)}` : ''}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
    attachLongPress(el, () => deleteRecord(el.dataset.id));
  });
}

// ---------- Calendar view ----------
function renderCal() {
  const start = weekAnchor;
  const end = addDays(start, 6);
  const sameMonth = start.getMonth() === end.getMonth();
  $('calMonth').textContent = sameMonth
    ? `${start.getFullYear()}年${start.getMonth()+1}月`
    : `${start.getMonth()+1}月 – ${end.getMonth()+1}月`;

  const dows = ['一','二','三','四','五','六','日'];
  const todayISO = toISO(new Date());
  const grid = $('weekGrid');

  // collect events per day, bucketed by AM/PM
  const eventsByDay = {};
  for (let i = 0; i < 7; i++) eventsByDay[toISO(addDays(start, i))] = { am: [], pm: [] };
  const types = [
    ['firstVisit', '初诊', 't-first', 'firstVisitP'],
    ['stage1', '一期', 't-stage1', 'stage1P'],
    ['stage2', '二期', 't-stage2', 'stage2P'],
    ['restore', '修复', 't-restore', 'restoreP'],
  ];
  records.forEach(r => {
    types.forEach(([key, label, cls, pKey]) => {
      const v = r[key];
      if (v && eventsByDay[v]) {
        const p = r[pKey] === 'pm' ? 'pm' : 'am';
        eventsByDay[v][p].push({ id: r.id, name: r.name || '未命名', label, cls });
      }
    });
  });

  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const iso = toISO(d);
    const isToday = iso === todayISO;
    html += `<div class="day-head ${isToday?'today':''}">
      <div class="dow">${dows[i]}</div>
      <div class="dnum">${d.getDate()}</div>
    </div>`;
  }
  const evHtml = (e) => `<div class="event ${e.cls}" data-id="${e.id}">
    <div class="ev-name">${esc(e.name)}</div>
    <div class="ev-type">${e.label}</div>
  </div>`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const iso = toISO(d);
    const evs = eventsByDay[iso];
    html += `<div class="day-col">
      <div class="period am" data-label="上午">${evs.am.map(evHtml).join('')}</div>
      <div class="period pm" data-label="下午">${evs.pm.map(evHtml).join('')}</div>
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.event').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
    attachLongPress(el, () => deleteRecord(el.dataset.id));
  });
}

function render() {
  if (currentView === 'list') renderList();
  else renderCal();
}

// ---------- Sheets ----------
function openSheet(el) { $('scrim').classList.add('show'); el.classList.add('show'); }
function closeAllSheets() {
  $('scrim').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
  editingId = null; viewingId = null;
}
function closeSheet(el) {
  el.classList.remove('show');
  if (!document.querySelector('.sheet.show')) $('scrim').classList.remove('show');
}

function openEdit(id) {
  editingId = id;
  const r = id ? records.find(x => x.id === id) : null;
  $('editTitle').textContent = r ? '编辑记录' : '新建记录';
  $('btnDelete').style.display = r ? 'block' : 'none';
  const today = toISO(new Date());
  $('f_firstVisit').value = r?.firstVisit || today;
  $('f_name').value = r?.name || '';
  $('f_gender').value = r?.gender || '';
  $('f_age').value = r?.age || '';
  $('f_contact').value = r?.contact || '';
  $('f_plan').value = r?.plan || '';
  $('f_materials').value = r?.materials || '';
  $('f_stage1').value = r?.stage1 || '';
  $('f_stage2').value = r?.stage2 || '';
  $('f_restore').value = r?.restore || '';
  $('f_firstVisitP').value = r?.firstVisitP || 'am';
  $('f_stage1P').value = r?.stage1P || 'am';
  $('f_stage2P').value = r?.stage2P || 'am';
  $('f_restoreP').value = r?.restoreP || 'am';
  pickTeethState = (r?.teeth || []).slice();
  pickSystemState = r?.system || '';
  updateTeethVal();
  updateSystemVal();
  ['f_plan','f_materials'].forEach(autoResize);
  openSheet($('editSheet'));
}
function autoResize(id) {
  const ta = $(id);
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
function updateTeethVal() {
  const v = $('teethVal');
  if (pickTeethState.length === 0) { v.textContent = '点击选择'; v.classList.add('empty'); }
  else { v.textContent = pickTeethState.join(', '); v.classList.remove('empty'); }
}
function updateSystemVal() {
  const v = $('systemVal');
  if (!pickSystemState) { v.textContent = '点击选择'; v.classList.add('empty'); }
  else { v.textContent = pickSystemState; v.classList.remove('empty'); }
}
function saveEdit() {
  const data = {
    firstVisit: $('f_firstVisit').value,
    name: $('f_name').value.trim(),
    gender: $('f_gender').value,
    age: $('f_age').value ? parseInt($('f_age').value, 10) : '',
    contact: $('f_contact').value.trim(),
    teeth: pickTeethState.slice(),
    system: pickSystemState,
    plan: $('f_plan').value.trim(),
    materials: $('f_materials').value.trim(),
    stage1: $('f_stage1').value,
    stage2: $('f_stage2').value,
    restore: $('f_restore').value,
    firstVisitP: $('f_firstVisitP').value,
    stage1P: $('f_stage1P').value,
    stage2P: $('f_stage2P').value,
    restoreP: $('f_restoreP').value,
  };
  if (!data.name && !data.firstVisit) { alert('请至少填写姓名或初诊日期'); return; }
  if (editingId) {
    const i = records.findIndex(x => x.id === editingId);
    records[i] = { ...records[i], ...data };
  } else {
    records.push({ id: uid(), ...data, createdAt: Date.now() });
  }
  persist(); render(); closeAllSheets();
}

function openDetail(id) {
  viewingId = id;
  const r = records.find(x => x.id === id);
  if (!r) return;
  $('detailTitle').textContent = r.name || '详情';
  const teethStr = (r.teeth && r.teeth.length) ? r.teeth.join(', ') : '—';
  $('detailBody').innerHTML = `
    <div class="group-title">基本信息</div>
    <div class="group">
      <div class="detail-row"><div class="k">初诊日期</div><div class="v">${esc(fmtDateP(r.firstVisit, r.firstVisitP)||'—')}</div></div>
      <div class="detail-row"><div class="k">姓名</div><div class="v">${esc(r.name||'—')}</div></div>
      <div class="detail-row"><div class="k">性别</div><div class="v">${esc(r.gender||'—')}</div></div>
      <div class="detail-row"><div class="k">年龄</div><div class="v">${r.age ? r.age+' 岁' : '—'}</div></div>
      <div class="detail-row"><div class="k">联系方式</div><div class="v">${esc(r.contact||'—')}</div></div>
    </div>
    <div class="group-title">方案</div>
    <div class="group">
      <div class="detail-row"><div class="k">牙位</div><div class="v">${esc(teethStr)}</div></div>
      <div class="detail-row"><div class="k">种植系统</div><div class="v">${esc(r.system||'—')}</div></div>
      <div class="detail-row stacked"><div class="k">手术方案</div><div class="v">${esc(r.plan||'—')}</div></div>
      <div class="detail-row stacked"><div class="k">手术耗材</div><div class="v">${esc(r.materials||'—')}</div></div>
    </div>
    <div class="group-title">时间安排</div>
    <div class="group">
      <div class="detail-row"><div class="k">一期手术</div><div class="v">${esc(fmtDateP(r.stage1, r.stage1P)||'—')}</div></div>
      <div class="detail-row"><div class="k">二期手术</div><div class="v">${esc(fmtDateP(r.stage2, r.stage2P)||'—')}</div></div>
      <div class="detail-row"><div class="k">修复时间</div><div class="v">${esc(fmtDateP(r.restore, r.restoreP)||'—')}</div></div>
    </div>
  `;
  openSheet($('detailSheet'));
}

// ---------- Tooth picker ----------
function renderTeethGrid() {
  const upper = $('teethGrid');
  let html = '<div class="teeth-row upper">';
  FDI_UPPER.forEach((n, i) => {
    const gap = i === 7 ? ' gap-r' : '';
    const sel = pickTeethState.includes(n) ? ' sel' : '';
    html += `<div class="tooth${sel}${gap}" data-n="${n}">${n}</div>`;
  });
  html += '</div><div class="midline"></div><div class="teeth-row lower">';
  FDI_LOWER.forEach((n, i) => {
    const gap = i === 7 ? ' gap-r' : '';
    const sel = pickTeethState.includes(n) ? ' sel' : '';
    html += `<div class="tooth${sel}${gap}" data-n="${n}">${n}</div>`;
  });
  html += '</div>';
  upper.innerHTML = html;
  upper.querySelectorAll('.tooth').forEach(el => {
    el.addEventListener('click', () => {
      const n = el.dataset.n;
      const i = pickTeethState.indexOf(n);
      if (i >= 0) pickTeethState.splice(i, 1); else pickTeethState.push(n);
      pickTeethState.sort();
      el.classList.toggle('sel');
      updateTeethSummary();
    });
  });
  updateTeethSummary();
}
function updateTeethSummary() {
  $('teethSummary').textContent = pickTeethState.length
    ? `已选 ${pickTeethState.length} 颗：${pickTeethState.join(', ')}`
    : '未选择';
}

// ---------- System picker ----------
function renderSystemChips() {
  const c = $('systemChips');
  c.innerHTML = systems.map(s => `
    <div class="chip ${s === pickSystemState ? 'sel' : ''}" data-s="${esc(s)}">
      <span>${esc(s)}</span>
      <span class="del" data-del="${esc(s)}">×</span>
    </div>
  `).join('') || '<div style="color:var(--text-3); padding: 8px;">还没有系统，下方添加</div>';
  c.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.del) {
        const name = e.target.dataset.del;
        if (confirm(`删除「${name}」？`)) {
          systems = systems.filter(x => x !== name);
          if (pickSystemState === name) pickSystemState = '';
          persist(); renderSystemChips();
        }
        return;
      }
      pickSystemState = el.dataset.s;
      renderSystemChips();
    });
  });
}

// ---------- Events ----------
$('btnNew').addEventListener('click', () => openEdit(null));
$('editCancel').addEventListener('click', closeAllSheets);
$('editSave').addEventListener('click', saveEdit);
$('detailClose').addEventListener('click', closeAllSheets);
$('detailEdit').addEventListener('click', () => {
  const id = viewingId; closeAllSheets();
  setTimeout(() => openEdit(id), 50);
});
$('btnDelete').addEventListener('click', () => {
  if (!editingId) return;
  if (confirm('确定删除这条记录吗？')) {
    records = records.filter(x => x.id !== editingId);
    persist(); render(); closeAllSheets();
  }
});
$('scrim').addEventListener('click', closeAllSheets);
$('search').addEventListener('input', render);

['f_plan','f_materials'].forEach(id => {
  $(id).addEventListener('input', () => autoResize(id));
});

// Segmented control
$('seg').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    $('seg').querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentView = b.dataset.view;
    $('viewList').style.display = currentView === 'list' ? '' : 'none';
    $('viewCal').style.display = currentView === 'cal' ? '' : 'none';
    render();
  });
});

// Calendar nav
$('calPrev').addEventListener('click', () => { weekAnchor = addDays(weekAnchor, -7); renderCal(); });
$('calNext').addEventListener('click', () => { weekAnchor = addDays(weekAnchor, 7); renderCal(); });
$('calToday').addEventListener('click', () => { weekAnchor = startOfWeek(new Date()); renderCal(); });

// Tooth picker open
$('pickTeeth').addEventListener('click', () => {
  renderTeethGrid();
  openSheet($('teethSheet'));
});
$('teethCancel').addEventListener('click', () => closeSheet($('teethSheet')));
$('teethDone').addEventListener('click', () => {
  updateTeethVal();
  closeSheet($('teethSheet'));
});

// System picker open
$('pickSystem').addEventListener('click', () => {
  renderSystemChips();
  openSheet($('systemSheet'));
});
$('systemCancel').addEventListener('click', () => closeSheet($('systemSheet')));
$('systemDone').addEventListener('click', () => {
  updateSystemVal();
  closeSheet($('systemSheet'));
});
$('systemAdd').addEventListener('click', () => {
  const v = $('systemNew').value.trim();
  if (!v) return;
  if (!systems.includes(v)) { systems.push(v); persist(); }
  pickSystemState = v;
  $('systemNew').value = '';
  renderSystemChips();
});
$('systemNew').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('systemAdd').click(); }
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
